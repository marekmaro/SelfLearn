name: Lektor (nagrania MP3)

# Po każdym nowym albo zmienionym wydaniu na main: nagranie lektora (Piper) do MP3.
# MP3 trafia do wydania „lektor” na GitHubie (poza historią repozytorium), a czasy fragmentów
# do content/audio/RRRR-MM-DD.json. Ten commit uruchamia nowe wdrożenie na Vercelu, które pobiera MP3
# (scripts/build-site.mjs), więc aplikacja serwuje je z własnego adresu.
# W pull requestach, które zmieniają nagrywanie, robi się próbne nagranie najnowszego wydania (jako artefakt).

on:
  push:
    branches: [main]
    paths:
      - 'content/editions/**'
      - 'scripts/make-audio.mjs'
      - 'src/chapters.js'
      - 'src/speech-text.js'
      - '.github/workflows/audio.yml'
  pull_request:
    paths:
      - 'scripts/make-audio.mjs'
      - 'src/speech-text.js'
      - '.github/workflows/audio.yml'
  workflow_dispatch:
    inputs:
      dates:
        description: 'Daty wydań do nagrania od nowa (RRRR-MM-DD, oddzielone spacją). Puste: ostatnie dni bez nagrania.'
        required: false

permissions:
  contents: write

concurrency:
  group: lektor-${{ github.event_name == 'pull_request' && github.head_ref || 'main' }}
  cancel-in-progress: false

env:
  TZ: Europe/Warsaw
  VOICE: pl_PL-gosia-medium
  PIPER_VERSION: 2023.11.14-2

jobs:
  audio:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Które wydania nagrać
        id: plan
        env:
          EVENT: ${{ github.event_name }}
          DATES_IN: ${{ github.event.inputs.dates }}
        run: |
          if [ "$EVENT" = "pull_request" ]; then
            DATES=$(ls content/editions | grep -E '^[0-9]{4}-[0-9]{2}-[0-9]{2}\.json$' | sort | tail -1 | cut -c1-10)
            FORCE=--force
          elif [ -n "$DATES_IN" ]; then
            # Tylko daty w postaci RRRR-MM-DD (pole formularza jest wpisywane ręcznie).
            DATES=$(echo "$DATES_IN" | tr ', ' '\n\n' | grep -E '^[0-9]{4}-[0-9]{2}-[0-9]{2}$' | tr '\n' ' ')
            FORCE=--force
          else
            DATES=$(node scripts/make-audio.mjs --list --voice "$VOICE")
            FORCE=
          fi
          echo "dates=$DATES" >> "$GITHUB_OUTPUT"
          echo "force=$FORCE" >> "$GITHUB_OUTPUT"
          echo "Do nagrania: ${DATES:-nic}"

      - name: Pamięć podręczna lektora
        if: steps.plan.outputs.dates != ''
        uses: actions/cache@v4
        with:
          path: tts
          key: piper-${{ env.PIPER_VERSION }}-${{ env.VOICE }}

      - name: Pobierz Piper, głos i ffmpeg
        if: steps.plan.outputs.dates != ''
        run: |
          mkdir -p tts
          if [ ! -x tts/piper/piper ]; then
            curl -fsSL "https://github.com/rhasspy/piper/releases/download/$PIPER_VERSION/piper_linux_x86_64.tar.gz" | tar xz -C tts
          fi
          BASE="https://huggingface.co/rhasspy/piper-voices/resolve/v1.0.0/pl/pl_PL/gosia/medium"
          [ -f "tts/$VOICE.onnx" ] || curl -fsSL -o "tts/$VOICE.onnx" "$BASE/$VOICE.onnx"
          [ -f "tts/$VOICE.onnx.json" ] || curl -fsSL -o "tts/$VOICE.onnx.json" "$BASE/$VOICE.onnx.json"
          command -v ffmpeg >/dev/null || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg)

      - name: Nagraj
        if: steps.plan.outputs.dates != ''
        run: node scripts/make-audio.mjs --tts "tts/piper/piper --model tts/$VOICE.onnx --sentence_silence 0.3" --voice "$VOICE" --out audio-out ${{ steps.plan.outputs.force }} ${{ steps.plan.outputs.dates }}

      - name: Próbne nagranie (pull request)
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: lektor-proba
          path: |
            audio-out/
            content/audio/
          retention-days: 7

      - name: Opublikuj MP3 i czasy fragmentów
        if: github.event_name != 'pull_request' && steps.plan.outputs.dates != ''
        env:
          GH_TOKEN: ${{ github.token }}
          DATES: ${{ steps.plan.outputs.dates }}
        run: |
          gh release view lektor >/dev/null 2>&1 || gh release create lektor --prerelease \
            --title "Lektor: nagrania wydań" \
            --notes "Pliki MP3 z lektorem, robione automatycznie przez .github/workflows/audio.yml. Aplikacja pobiera je przy wdrożeniu. Starsze niż 30 dni są usuwane."
          gh release upload lektor audio-out/*.mp3 --clobber
          for f in $(node scripts/make-audio.mjs --old 30 $(gh release view lektor --json assets -q '.assets[].name')); do
            gh release delete-asset lektor "$f" -y
          done
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/audio
          git commit -m "Lektor: nagranie wydań $DATES" || exit 0
          for i in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep 5
          done
          exit 1
